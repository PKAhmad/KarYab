name: karyab
description: KarYab - Job Finder for Afghan Workers in Germany
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  audioplayers: ^5.2.1
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  image_cropper: ^12.2.1
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  webview_flutter: ^4.8.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/templates/thumbnails/
    - assets/templates/
    - assets/fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
